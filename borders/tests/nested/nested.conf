# Config do Hyprland aninhado usado por run.sh. Parecida com a sessão real: tudo flutuante, hyprbars,
# borders-plus-plus e os plugins do repo (carregados pelo run.sh com hyprctl, não aqui).
# run.sh trabalha numa cópia deste arquivo (o teste de reload altera a cópia, nunca este).

monitor = WAYLAND-1, 1280x800, 0x0, 1
# 2º monitor, criado por `hyprctl output create wayland`; escala fracionária de propósito
monitor = WAYLAND-2, 1200x900, 1280x0, 1.6

general {
    border_size = 1
    gaps_in = 4
    gaps_out = 4
}

decoration {
    rounding = 8
    rounding_power = 2
    shadow {
        enabled = false
        # o hyprborders troca isto por 3 só durante o próprio desenho; run.sh confere que volta a 1
        render_power = 1
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

debug {
    disable_logs = false
}

windowrule {
    name = all-float
    match:class = .*
    float = on
    size = 500 350
    center = on
}

plugin {
    hyprbars {
        bar_height = 30
        bar_buttons_alignment = left
        bar_padding = 10
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_color = rgb(242424)
        col.text = rgb(ffffff)
        bar_text_size = 10
        hyprbars-button = rgb(ff5555), 14, x, hyprctl dispatch killactive
        hyprbars-button = rgb(ffb86c), 14, o, hyprctl dispatch fullscreen 0
    }
    borders-plus-plus {
        natural_rounding = true
        add_borders = 2
        col.border_1 = rgb(050505)
        col.border_2 = rgb(727272)
        border_size_1 = 1
        border_size_2 = 1
    }
    hyprborders {
        shadow = 1
        shadow_blur = 70
    }
}
