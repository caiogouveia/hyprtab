[repository]
name = "hyprtab"
authors = ["caio"]
commit_pins = []

[hyprtab]
description = "Alt+Tab com ícones dos apps para o Hyprland"
authors = ["caio"]
output = "plugins/hyprtab/hyprtab.so"
build = ["make -C plugins/hyprtab all"]

[hyprdock]
description = "Dock com zoom para o Hyprland"
authors = ["caio"]
output = "dock/hyprdock.so"
build = ["make -C dock all"]

[hyprmotif]
description = "Molduras estilo Motif/mwm para o Hyprland"
authors = ["caio"]
output = "motif/hyprmotif.so"
build = ["make -C motif all"]
output = "plugins/dock/hyprdock.so"
build = ["make -C plugins/dock all"]

[hyprmenu]
description = "Barra de menus global para o Hyprland"
authors = ["caio"]
output = "plugins/menubar/hyprmenu.so"
build = ["make -C plugins/menubar all"]

[hyprpager]
description = "Pager de workspaces para o Hyprland"
authors = ["caio"]
output = "plugins/pager/hyprpager.so"
build = ["make -C plugins/pager all"]

[hyprfind]
description = "Busca rápida (apps, janelas, arquivos) para o Hyprland"
authors = ["caio"]
output = "plugins/find/hyprfind.so"
build = ["make -C plugins/find all"]

[hyprborders]
description = "Bordas e sombras das janelas para o Hyprland"
authors = ["caio"]
output = "plugins/borders/hyprborders.so"
build = ["make -C plugins/borders all"]
