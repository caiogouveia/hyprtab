name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    # publica o que compilou; as versões experimentais que falharem simplesmente ficam de fora
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: hyprtab-*
          merge-multiple: true

      - name: Checksums
        run: |
          ls -l dist
          [ -n "$(ls dist/*.so 2>/dev/null)" ] || { echo "nenhum .so compilado"; exit 1; }
          (cd dist && sha256sum *.so > SHA256SUMS)

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.so dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Um .so por versão do Hyprland (hyprtab-hyprlandX.Y.Z.so). Use o que corresponde exatamente à sua versão (hyprctl version)."
