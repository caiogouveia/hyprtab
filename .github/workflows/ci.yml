name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reaproveitado pelo release.yml

jobs:
  # Testes do modelo de cada plugin: não dependem do Hyprland, então rodam
  # direto no Ubuntu (com ASan/UBSan) sem instalar o Arch. Dá feedback rápido.
  tests:
    name: Testes (sem Hyprland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar plugins
        run: make test

  build:
    name: Hyprland ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # a versão mais recente do Hyprland no Arch (verificada)
          - { label: latest, date: "",           experimental: false }
          # versões antigas: snapshot do archive do Arch no dia do último pacote de cada série.
          # Experimentais: se não compilarem, ficam de fora da release sem quebrar o CI.
          - { label: "0.56", date: "2026/09/30", experimental: true }
          - { label: "0.55", date: "2026/06/11", experimental: true }
          - { label: "0.54", date: "2026/04/29", experimental: true }
          - { label: "0.53", date: "2026/02/04", experimental: true }
          - { label: "0.52", date: "2025/12/29", experimental: true }
    steps:
      - name: Dependências
        run: |
          if [ -n "${{ matrix.date }}" ]; then
            echo 'Server = https://archive.archlinux.org/repos/${{ matrix.date }}/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          fi
          pacman --disable-download-timeout -Syyuu --noconfirm --needed \
            git hyprland base-devel cairo pango pkgconf librsvg systemd-libs libxkbcommon

      - uses: actions/checkout@v4

      - name: Versão do Hyprland
        id: hl
        run: |
          v="$(pkg-config --modversion hyprland)"
          echo "version=$v" | tee -a "$GITHUB_OUTPUT"
          # protege contra snapshot com a versão errada
          if [ "${{ matrix.label }}" != "latest" ] && [ "${v#${{ matrix.label }}.}" = "$v" ]; then
            echo "::error::esperava Hyprland ${{ matrix.label }}.x, instalou $v (ajuste a data do snapshot)"
            exit 1
          fi

      - name: Compilar e testar
        run: |
          for p in hyprtab dock menubar pager find borders; do
            echo "::group::$p"
            make -C plugins/$p
            make -C plugins/$p test
            echo "::endgroup::"
          done

      - name: Conferir símbolos de plugin
        run: |
          for so in plugins/hyprtab/hyprtab.so plugins/dock/hyprdock.so plugins/menubar/hyprmenu.so plugins/pager/hyprpager.so plugins/find/hyprfind.so plugins/borders/hyprborders.so; do
            echo "$so"
            nm -D --defined-only "$so" | grep -iE 'plugin(Init|Exit|APIVersion)'
          done

      - name: Empacotar
        run: |
          mkdir -p dist
          for so in plugins/hyprtab/hyprtab.so plugins/dock/hyprdock.so plugins/menubar/hyprmenu.so plugins/pager/hyprpager.so plugins/find/hyprfind.so plugins/borders/hyprborders.so; do
            n="$(basename "$so" .so)"
            cp "$so" "dist/$n-hyprland${{ steps.hl.outputs.version }}.so"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hyprtab-${{ matrix.label }}
          path: dist/*.so
          if-no-files-found: error
