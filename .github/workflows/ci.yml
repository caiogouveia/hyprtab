name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reaproveitado pelo release.yml

jobs:
  build:
    name: Hyprland ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # a versão mais recente do Hyprland no Arch (verificada)
          - { label: latest, date: "",           experimental: false }
    steps:
      - name: Dependências
        run: |
          if [ -n "${{ matrix.date }}" ]; then
            echo 'Server = https://archive.archlinux.org/repos/${{ matrix.date }}/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          fi
          pacman --disable-download-timeout -Syyuu --noconfirm --needed \
            git hyprland base-devel cairo pango pkgconf librsvg

      - uses: actions/checkout@v4

      - name: Versão do Hyprland
        id: hl
        run: |
          v="$(pkg-config --modversion hyprland)"
          echo "version=$v" | tee -a "$GITHUB_OUTPUT"
          # protege contra snapshot com a versão errada
          if [ "${{ matrix.label }}" != "latest" ] && [ "${v#${{ matrix.label }}.}" = "$v" ]; then
            echo "::error::esperava Hyprland ${{ matrix.label }}.x, instalou $v (ajuste a data do snapshot)"
            exit 1
          fi

      - name: Compilar
        run: make

      - name: Testes
        run: make test

      - name: Compilar dock
        run: make -C dock

      - name: Testes dock
        run: make -C dock test

      - name: Conferir símbolos de plugin
        run: |
          for so in hyprtab.so dock/hyprdock.so; do
            echo "$so"
            nm -D --defined-only "$so" | grep -iE 'plugin(Init|Exit|APIVersion)'
          done

      - name: Empacotar
        run: |
          mkdir -p dist
          cp hyprtab.so "dist/hyprtab-hyprland${{ steps.hl.outputs.version }}.so"
          cp dock/hyprdock.so "dist/hyprdock-hyprland${{ steps.hl.outputs.version }}.so"

      - uses: actions/upload-artifact@v4
        with:
          name: hyprtab-${{ matrix.label }}
          path: dist/*.so
          if-no-files-found: error
